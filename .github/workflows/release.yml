name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode = major*10000 + minor*100 + patch (e.g. v1.2.3 -> 10203); any -suffix is ignored.
          # Strictly increasing as long as minor and patch stay below 100.
          CORE="${VERSION%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "MINIMAL_AGENDA_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Host tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Build FOSS APK and Play AAB
        env:
          MINIMAL_AGENDA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MINIMAL_AGENDA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MINIMAL_AGENDA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :androidApp:assembleFossRelease :androidApp:bundlePlayRelease
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk "dist/MinimalAgenda-${VERSION_NAME}.apk"
          cp androidApp/build/outputs/bundle/playRelease/androidApp-play-release.aab "dist/MinimalAgenda-${VERSION_NAME}-play.aab"

      - name: Upload Play AAB (workflow artifact only)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: play-release-aab
          path: dist/MinimalAgenda-*-play.aab

      - name: Create GitHub Release with FOSS APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v1.2.0-rc1) are marked as pre-releases.
          PRERELEASE=""
          [[ "$VERSION_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" "dist/MinimalAgenda-${VERSION_NAME}.apk" \
            --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE

      # Google Play upload. Skipped until the PLAY_SERVICE_ACCOUNT_JSON secret exists, for suffixed tags
      # (a suffix does not change versionCode, so v1.2.0-rc1 and v1.2.0 could not both be uploaded), and while
      # the PLAY_UPLOAD repository variable is false (for a versionCode already uploaded to Play by hand).
      - name: Check Google Play upload
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_UPLOAD: ${{ vars.PLAY_UPLOAD }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; upload the AAB artifact to Google Play by hand."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [[ "$PLAY_UPLOAD" == "false" ]]; then
            echo "::notice::PLAY_UPLOAD is false; not uploading to Google Play."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION_NAME" == *-* ]]; then
            echo "::notice::Pre-release tag; not uploading to Google Play."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
          # Play release notes come from the F-Droid changelog for this versionCode (max 500 characters).
          NOTES="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          mkdir -p dist/whatsnew
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" dist/whatsnew/whatsnew-en-US
          else
            echo "::warning::No changelog at $NOTES; the Play release has no release notes."
          fi

      - name: Upload Play AAB to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.giant.agenda
          releaseFiles: dist/MinimalAgenda-${{ env.VERSION_NAME }}-play.aab
          # Repository variables: PLAY_TRACK (internal, alpha, beta, production) and PLAY_RELEASE_STATUS
          # (draft, completed). Keep draft until the app has been published once: Google Play only accepts
          # draft releases for an app that has never been published.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: ${{ hashFiles('dist/whatsnew/whatsnew-en-US') != '' && 'dist/whatsnew' || '' }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
