name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Host tests
        run: ./gradlew :shared:testAndroidHostTest
      - name: Debug builds
        run: ./gradlew :androidApp:assemblePlayDebug :androidApp:assembleFossDebug
